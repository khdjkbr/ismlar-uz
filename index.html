<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ismlar.uz — O'zbek ismlari ma'nosi to'liq katalogi</title>
  <meta name="description" content="O'zbek ismlari ma'nosi, kelib chiqishi va to'liq izohi. Farzandingiz uchun eng chiroyli ismlar katalogi.">
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-neutral">

  <!-- Фоновый младенческий узор -->
  <div class="baby-bg-pattern" aria-hidden="true"></div>

  <!-- ВСЕГДА ВИДИМАЯ ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="sticky-header" id="stickyHeader">
    <div class="header-container">
      <div class="brand-row">
        <a href="#" class="brand-logo" id="logoLink">
          <span class="logo-icon">🍼</span>
          <span class="logo-text">Ismlar<span class="logo-tld">.uz</span></span>
        </a>
        <!-- Кнопка "Избранное" -->
        <button type="button" class="header-fav-btn" id="btnOpenFavorites" onclick="window.openFavoritesModal()" title="Sevimlilar (7 kun saqlanadi)">
          <span class="fav-icon">❤️</span>
          <span class="fav-label" id="favLabelText">Sevimlilar</span>
          <span class="fav-counter-badge" id="favHeaderBadge">0</span>
        </button>
      </div>

      <!-- Постоянный поиск -->
      <div class="search-bar-wrap">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Ism bo'yicha tezkor qidiruv..." autocomplete="off">
          <button type="button" id="clearSearchBtn" class="clear-btn" aria-label="Tozalash" style="display: none;">✕</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Верхний рекламный баннер -->
  <div class="ad-banner-wrap container">
    <div class="ad-placeholder banner-top" id="adTop">
      <span class="ad-tag">Reklama / Реклама</span>
      <div class="ad-content">
        <p>📱 Banner Reklama joyi (728x90 / 320x100)</p>
      </div>
    </div>
  </div>

  <main class="main-content container">

    <!-- ШАГ 1: ПРИВЕТСТВИЕ И ВЫБОР АЛФАВИТА -->
    <section class="wizard-step step-welcome" id="stepWelcome">
      <div class="welcome-card">
        <div class="baby-illustration">👶✨</div>
        <h1 class="welcome-title" id="welcomeTitle">Farzandingiz uchun eng chiroyli va ma'noli ismni tanlang</h1>
        <p class="welcome-desc" id="welcomeSubtitle">
          12 000+ dan ortiq o'zbek xalq ismlarining to'liq ma'nosi, kelib chiqishi va izohi.
        </p>
        <p class="prompt-text" id="chooseAlphabetPrompt">Dastlab o'zingizga qulay alifboni tanlang:</p>
        
        <div class="alphabet-choice-btns">
          <button type="button" class="choice-card-btn" id="btnChooseLotin" onclick="window.selectScript('lotin')">
            <span class="choice-icon">🅰️</span>
            <div class="choice-text-wrap">
              <strong class="choice-name">Ismlar lotin alifbosida</strong>
              <small class="choice-sub">O'zbek lotin alifbosi</small>
            </div>
            <span class="choice-arrow">➔</span>
          </button>

          <button type="button" class="choice-card-btn" id="btnChooseKirill" onclick="window.selectScript('kirill')">
            <span class="choice-icon">🔤</span>
            <div class="choice-text-wrap">
              <strong class="choice-name">Исмлар кирилл алифбосида</strong>
              <small class="choice-sub">Ўзбек кирилл алифбоси</small>
            </div>
            <span class="choice-arrow">➔</span>
          </button>
        </div>
      </div>
