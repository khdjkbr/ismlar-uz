<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bog'lanish — Bolagaism.uz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-heading: 'Comfortaa', cursive, system-ui, sans-serif;
      --font-body: 'Nunito', system-ui, sans-serif;
      --bg-color: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-main: #3C3835;
      --text-muted: #7A736E;
      --boy-color: #4A90E2;
      --border-light: #EBE4DA;
      --shadow-md: 0 4px 16px rgba(90, 70, 50, 0.08);
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }
    h1 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      color: var(--text-main);
      margin-bottom: 20px;
    }
    p {
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 1rem;
    }
    .contact-box {
      background: #FAF7F2;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      margin: 20px 0;
    }
    .contact-item {
      margin-bottom: 12px;
      font-size: 1.05rem;
    }
    .contact-item strong {
      color: var(--text-main);
    }
    .contact-item a {
      color: var(--boy-color);
      text-decoration: none;
      font-weight: 700;
    }
    .contact-item a:hover {
      text-decoration: underline;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--boy-color);
      text-decoration: none;
      font-weight: 700;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bog'lanish</h1>
    <p>Reklama, hamkorlik yoki takliflar uchun biz bilan quyidagi aloqa vositalari orqali bog'lanishingiz mumkin.</p>
    
    <div class="contact-box">
      <div class="contact-item">
        <strong>📧 E-mail:</strong> <a href="mailto:khdjkbr@yandex.com">khdjkbr@yandex.com</a>
      </div>
      <div class="contact-item">
        <strong>✈️ Telegram:</strong> <a href="https://t.me/khodjiakbar" target="_blank" rel="noopener">@khodjiakbar.</a>
      </div>
    </div>

    <p>Biz har doim yangi takliflar va fikr-mulohazalarga ochiqmiz!</p>

    <a href="./" class="back-link">← Asosiy sahifaga qaytish</a>
  </div>
</body>
</html>
